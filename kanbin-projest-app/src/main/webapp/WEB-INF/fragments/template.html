<!DOCTYPE html>
<html>
	<head th:fragment="head(title)">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="api-base-url" th:content="@{/}" />

        <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}" />
        <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}" />

        <title th:replace="${title}"></title>
    	<link rel="stylesheet" type="text/css" media="all" th:href="@{/libs/bootstrap.min.css}"/>
		<link rel="stylesheet" type="text/css" media="all" th:href="@{/resources/style.css}"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	</head>
	<body>
        <div th:fragment="footer">
            <script type="text/javascript" th:src="@{/libs/bootstrap.bundle.min.js}" ></script>
            <script type="text/javascript" th:src="@{/resources/project.js}"></script>
        </div>
	</body>
</html>
