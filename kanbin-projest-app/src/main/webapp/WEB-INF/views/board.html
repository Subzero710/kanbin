<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:include="../fragments/template :: head(~{::title})">
    <title>Kanbin Board</title>
</head>
<body>
<div class="main-wrapper">

    <div style="margin-bottom: 15px;">
        <a th:href="@{/issues}" class="btn btn-secondary" id="btn-to-issues">
            Gérer les Stories
        </a>
    </div>

    <form th:action="@{/board/add-column}" method="post" accept-charset="UTF-8" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
        <label>
            <input type="text" name="title" placeholder="Titre de la nouvelle colonne" required maxlength="30" style="padding: 5px;"/>
        </label>

        <label>
            <select name="type" style="padding: 5px;">
                <option value="simple">Simple</option>
                <option value="double" selected>Double</option>
            </select>
        </label>

        <input type="submit" value="Ajouter Colonne" class="btn btn-primary btn-sm"/>
    </form>

    <h1 class="page-title">Kanbin</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="board" id="board">
        <section class="kb-col kb-main-col"
                 th:each="c, iterStat : ${columns}"
                 th:attr="data-col=${c.key}, data-id=${c.id}"
                 th:classappend="${c.fixed} ? 'kb-col-fixed' : 'kb-col-draggable'"
                 th:draggable="${!c.fixed}"
                 th:style="'width:' + (${c.subColumns.isEmpty() ? 260 : (260 * c.subColumns.size()) + 20}) + 'px;'">

            <header class="kb-col-header">
                <span th:id="'col-title-' + ${c.key}">
                    <span th:text="${c.title}">Column</span>
                    <span th:if="${c.wipLimit != null and c.wipLimit > 0}"
                          class="badge bg-secondary ms-2"
                          th:text="${wipUsageByColumnId[c.id]} + ' / ' + ${c.wipLimit}">
                        0 / 0
                    </span>
		        </span>

                <div style="display:inline-block; float:right;">
                    <a th:if="${!c.fixed}"
                       th:href="@{/board/columns/{id}/edit(id=${c.id})}"
                       class="btn btn-warning btn-sm"
                       style="padding: 0 5px; margin-right: 5px;"
                       title="Renommer">edit</a>

                    <form th:if="${!c.fixed}"
                          th:action="@{/board/remove-column}" method="post" style="display:inline;">
                        <input type="hidden" name="columnId" th:value="${c.id}"/>
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette colonne ?')"
                                value="Remove column"
                                style="padding: 0 5px;">
                            X
                        </button>
                    </form>
                </div>
            </header>

            <div class="kb-sub-wrapper">
                <div class="kb-col sub-col"
                     th:each="sub : ${c.subColumnsOrSelf}"
                     th:attr="data-col=${sub.key}">

                    <header class="kb-col-header sub-header" th:unless="${c.subColumns.isEmpty()}">
                        <span th:text="${sub.title}">Sous-titre</span>
                    </header>

                    <div class="kb-col-body">

                        <article class="kb-card issue-draggable"
                                 draggable="true"
                                 th:attr="data-id=${issue.id}"
                                 th:each="issue : ${issuesByColumn[sub.key]}">

                            <div class="kb-card-title" th:text="${issue.title}">Titre</div>

                            <div class="kb-card-detail">
                                <span th:text="${issue.detail}">Détail de la story...</span>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<div th:replace="../fragments/template :: footer"></div>
</body>
</html>
