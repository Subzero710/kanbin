<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="../fragments/template :: head(~{::title})">
    <title>Liste des Stories (Création)</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Stories du Projet Kanban</h1>

    <a th:href="@{/issues/new}" class="btn btn-success mb-3">
        Ajouter une nouvelle Story ➕
    </a>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">Message de succès !</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Titre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="issue : ${issues}">
            <td th:text="${issue.id}">1</td>
            <td th:text="${issue.title}">Titre de l'Issue</td>
            <td></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/hello}" class="btn btn-secondary mt-3">Aller à la page /hello (test)</a>
</div>

<div th:replace="../fragments/template :: footer"></div>
</body>
</html>
