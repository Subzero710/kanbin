global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    monitor: 'kanbin-eco-benchmark'

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']