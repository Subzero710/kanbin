version: '3.8'

services:
  kanbin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanbin-app-eco
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - kanbin-metrologie
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    labels:
      - "com.example.description=Kanbin Application"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor-eco
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - kanbin-metrologie
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus-eco
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - kanbin-metrologie
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-eco
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - kanbin-metrologie
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  kanbin-metrologie:
    name: kanbin-metrologie

volumes:
  prometheus-data:
  grafana-storage:
