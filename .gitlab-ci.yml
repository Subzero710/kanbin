image: maven:3-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

stages:
  - build_and_test
  - integration
  - package
  - run

# --- ÉTAPE 1 : BUILD ---
build_job:
  stage: build_and_test
  script:
    # On télécharge failsafe maintenant pour le cache
    - mvn $MAVEN_OPTS clean install -DskipITs spotbugs:check failsafe:help
    - grep -v 'COMPLEXITY_MISSED,COMPLEXITY_COVERED' kanbin-projest-reporting/target/site/jacoco-aggregate/jacoco.csv | awk -F, '{missed += $10 ; covered += $11} END {print "Jacoco Coverage:", 100*covered/(covered+missed), "%"}'
  artifacts:
    expire_in: 1 hour
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    paths:
      - "**/target/*.war"
      - "**/target/classes"
      - "**/target/test-classes"
      - ".m2/repository/fr/uha/ensisa/gl/kanbin/**"

# --- ÉTAPE 2 : INTEGRATION (LA CORRECTION EST ICI) ---
integration_test_job:
  stage: integration
  services:
    - name: selenium/standalone-chrome
      alias: selenium-chrome
  variables:
    # URL du service Selenium (le navigateur)
    SELENIUM_URL: "http://selenium-chrome:4444/wd/hub"
  script:
    # 1. On récupère l'adresse IP de CE conteneur (là où tourne Jetty)
    - export MY_IP=$(hostname -i)
    - echo "Mon IP est : $MY_IP"

    # 2. La commande Maven Ultime :
    # -nsu : Utilise le cache local
    # -Dselenium.remote.browser=1 : Active le 'if' dans ton code Java (selon le prof)
    # -Dselenium.remote.url=... : Dit à Java où est le navigateur
    # -Dhost=$MY_IP : Dit à Java quelle URL donner au navigateur (http://172.x.x.x:8080)
    # -Djetty.http.host=0.0.0.0 : OBLIGATOIRE. Ouvre Jetty au monde extérieur (sinon Connection Refused)
    - mvn -nsu $MAVEN_OPTS -Dselenium.remote.browser=1 -Dselenium.remote.url=$SELENIUM_URL -Dhost=$MY_IP -Djetty.http.host=0.0.0.0 failsafe:integration-test failsafe:verify -Dsurefire.skip=true
  dependencies:
    - build_job

# --- ÉTAPE 3 : KANIKO ---
docker-build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - WARFILE=$(find kanbin-projest-app/target -name "*.war")
    - echo "FROM jetty:12-jdk21-eclipse-temurin" > Dockerfile
    - echo "EXPOSE 8080" >> Dockerfile
    - echo "ADD $WARFILE /var/lib/jetty/webapps/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}.war" >> Dockerfile
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-latest}
  dependencies:
    - build_job
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release-.*$/
    - if: $CI_COMMIT_TAG

# --- ÉTAPE 4 : KUBERNETES ---
.kubernetes: &kubernetes
  stage: run
  image: docker-private.cluster.ensisa.uha.fr/docker/kubectl
  script:
    - kubectl config set-cluster k8s --server="${K8S_SERVER}" --certificate-authority=${K8S_CERTIFICATE_AUTHORITY}
    - kubectl config set-credentials gitlab-ci --token="${K8S_USER_TOKEN}"
    - kubectl config set-context default --cluster=k8s --user=gitlab-ci
    - kubectl config use-context default
    - APP_NAME="${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}"
    - NAMESPACE="gitlab-cd-${ENV}"
    - kubectl -n ${NAMESPACE} create secret docker-registry $APP_NAME-registry-secret --docker-server=${CI_REGISTRY} --docker-username=${CI_DEPLOY_USER} --docker-password=${CI_DEPLOY_PASSWORD} --dry-run -o yaml | kubectl -n ${NAMESPACE} apply -f -
    - |
      echo "
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app: $APP_NAME
        name: $APP_NAME
        namespace: $NAMESPACE
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: $APP_NAME
        template:
          metadata:
            labels:
              app: $APP_NAME
          spec:
            containers:
              - image: "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-latest}"
                imagePullPolicy: Always
                name: $APP_NAME
                ports:
                  - name: http
                    containerPort: 8080
            imagePullSecrets:
              - name: $APP_NAME-registry-secret
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: $APP_NAME-service
        namespace: $NAMESPACE
      spec:
        type: ClusterIP
        selector:
          app: $APP_NAME
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 8080
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: $APP_NAME-ingress
        namespace: $NAMESPACE
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
      spec:
        rules:
        - host: ${ENV}.cluster.ensisa.uha.fr
          http:
            paths:
            - path: /$APP_NAME
              pathType: Prefix
              backend:
                service:
                  name: $APP_NAME-service
                  port:
                    number: 80
      " > app.yml
    - cat app.yml
    - kubectl ${ACTION} -f app.yml
    - kubectl -n $NAMESPACE rollout restart deployment $APP_NAME 2>/dev/null || /bin/true

deploy-staging:
  <<: *kubernetes
  variables:
    ENV: staging
    ACTION: apply
  environment:
    name: staging
    url: https://staging.cluster.ensisa.uha.fr/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}
    on_stop: stop-staging
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-.*$/

deploy-prod:
  <<: *kubernetes
  variables:
    ENV: prod
    ACTION: apply
  when: manual
  environment:
    name: production
    url: https://prod.cluster.ensisa.uha.fr/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}
    on_stop: stop-prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stop-staging:
  <<: *kubernetes
  variables:
    ENV: staging
    ACTION: delete
  when: manual
  environment:
    name: staging
    action: stop

stop-prod:
  <<: *kubernetes
  variables:
    ENV: prod
    ACTION: delete
  when: manual
  environment:
    name: production
    action: stop